name: CI

# Fails fast on the exact breakages that bit us before:
# - pnpm-lock.yaml out of sync with package.json (--frozen-lockfile install)
# - backend tsc errors (missing deps, bad imports)
# - frontend / functions builds
# Lint is intentionally not run: both eslint setups are broken
# pre-existing (frontend misses eslint-config-react-app, backend
# lints stale dist output). Fix those, then add lint jobs here.

'on':
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install (frozen lockfile must match package.json)
        run: pnpm install --frozen-lockfile

      - name: Build ff-types
        run: pnpm --filter @ff-mern/ff-types build

      - name: Build backend (tsc project refs)
        run: pnpm --filter backend build

      - name: Backend tests
        run: pnpm --filter backend test --passWithNoTests

      - name: Scoring regression tests
        run: pnpm --filter backend test:scoring

      - name: Build frontend
        run: pnpm --filter ff-mern build

      - name: Build functions
        run: pnpm --filter functions build
