# Ship to production when master moves:
#   1. frontend -> Firebase Hosting (live channel)
#   2. scrapers -> Cloud Functions
# The backend goes out via Render auto-deploy off master, so keep
# frontend deploys paired with it: the new frontend sends ID tokens
# and the old one breaks against the authed API.
#
# Required repo secret:
#   FIREBASE_SERVICE_ACCOUNT_FF_MERN (firebase init hosting:github)
#
# Both deploys use this service account. It must have Firebase Hosting Admin,
# Cloud Functions Admin, and Service Account User permissions in GCP.

name: Deploy to production on merge

'on':
  push:
    branches:
      - master
      - main

jobs:
  hosting-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install (frozen lockfile must match package.json)
        run: pnpm install --frozen-lockfile

      - name: Build frontend (emits to frontend/build per firebase.json)
        run: pnpm --filter ff-mern build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FF_MERN }}'
          channelId: live
          projectId: ff-mern

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install (frozen lockfile must match package.json)
        run: pnpm install --frozen-lockfile

      - name: Build functions (tsc emits lib/, predeploy is a no-op)
        run: pnpm --filter functions build

      - name: Configure Firebase application credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FF_MERN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "FIREBASE_SERVICE_ACCOUNT_FF_MERN is not configured."
            exit 1
          }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: pnpm exec firebase deploy --only functions --project ff-mern --non-interactive
